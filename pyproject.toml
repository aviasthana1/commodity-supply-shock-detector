[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commodity-supply-shock-detector"
version = "0.1.0"
description = "Event-driven detection of commodity supply and disruption shocks from news and price anomalies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Avi Asthana", email = "aviasthana@gmail.com" }]
keywords = ["quantitative-finance", "machine-learning", "macro", "trading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
commodity_supply_shock_detector = "commodity_supply_shock_detector.__main__:main"

[project.urls]
Homepage = "https://github.com/aviasthana1/commodity-supply-shock-detector"
Issues = "https://github.com/aviasthana1/commodity-supply-shock-detector/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_supply_shock_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
